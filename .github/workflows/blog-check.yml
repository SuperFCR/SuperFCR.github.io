name: Blog Check

on:
  push:
    branches:
      - main
    paths:
      - "blogs/**"
      - "assets/css/blog.css"
      - "assets/js/blog-*.js"
      - ".github/workflows/blog-check.yml"
  pull_request:
    paths:
      - "blogs/**"
      - "assets/css/blog.css"
      - "assets/js/blog-*.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check blog pages against blogs/README.md
        run: python3 blogs/check.py
