<div class="paper-card" data-content-id="{{analyticsId}}" data-research-area="{{analyticsArea}}" data-selected="{{isSelected}}">
    <div class="paper-content">
        {{#if links.[0].url}}
        <a href="{{links.[0].url}}" class="paper-title" data-resource-type="{{links.[0].type}}">{{{title}}}</a>
        {{else}}
        <span class="paper-title">{{{title}}}</span>
        {{/if}}
        <div class="paper-authors">{{{authors}}}</div>
        <div class="paper-desc">{{{description}}}</div>
        <div class="tag-row">
            <span class="badge badge-venue">{{venue}}</span>
            {{#each links}}
            <a href="{{url}}" class="badge badge-link" target="_blank" rel="noopener noreferrer" data-resource-type="{{type}}">
                {{label}}
                {{#if stars}}
                    <span style="margin-left:2px; opacity:0.8;">★{{stars}}</span>
                {{/if}}
            </a>
            {{/each}}
        </div>
    </div>
    <img class="paper-img" src="{{image}}" alt="{{@root.ui.projectImageAlt}}" loading="lazy">
</div>
