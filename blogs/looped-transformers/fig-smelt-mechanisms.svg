  <text x="440" y="190" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">By Sparsity (S):</text>
  <text x="440" y="216" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">• S = 0%: ~7/8 reused</text>
