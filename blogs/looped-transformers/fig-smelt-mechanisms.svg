<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="700" y="40" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1e293b">Inside SMELT's Second Pass (Section 6 Mechanistic Probes)</text>
  <text x="700" y="65" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">Probed across 1M held-out validation tokens and Dyck-language bracket-matching tasks</text>

  <!-- ==================== Q1: EXPERT ROUTING (§6.1) ==================== -->
  <rect x="28" y="88" width="660" height="244" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
