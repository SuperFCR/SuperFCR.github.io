  <circle cx="194" cy="228" r="80" fill="#dbeafe" fill-opacity="0.7" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="298" cy="228" r="80" fill="#fce7f3" fill-opacity="0.65" stroke="#b83b5e" stroke-width="2.5"/>
