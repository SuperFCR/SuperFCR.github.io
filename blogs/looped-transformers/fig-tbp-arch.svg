  <text x="726" y="514" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#1f4e79">W<tspan dy="3" font-size="11">inj</tspan><tspan dy="-3"> [ s₀ ; s</tspan><tspan dy="3" font-size="11">t−1</tspan><tspan dy="-3"> ]</tspan></text>

