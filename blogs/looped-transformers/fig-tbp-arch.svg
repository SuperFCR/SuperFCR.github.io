  <text x="782" y="582" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#9a4a0c">s<tspan dy="3" font-size="11">t−1</tspan></text>
  <text x="726" y="601" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#475569">W<tspan dy="3" font-size="10">inj</tspan><tspan dy="-3"> ∈ ℝ</tspan><tspan dy="-4" font-size="10">d×2d</tspan><tspan dy="4"> initialized to [I, 0] · MuonH</tspan></text>

  <!-- ==================== PANEL C: COMPUTE LEDGER ==================== -->
  <rect x="944" y="84" width="428" height="528" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
