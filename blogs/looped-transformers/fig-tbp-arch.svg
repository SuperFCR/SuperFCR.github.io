<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" rx="16" fill="#ffffff"/>

  <defs>
    <marker id="tAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#9a4a0c"/>
    </marker>
    <marker id="tBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1f4e79"/>
    </marker>
    <marker id="tTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0e6b74"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1e293b">Truncate or Not? Architecture: Prelude–Recurrent–Coda &amp; (T, B) Graph</text>
  <text x="700" y="63" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" fill="#64748b">Drawn for (T, B) = (4, 2): input re-injection s₀ at every iteration, shared weights θ, and leading FLOP ledger (Xiong, Chen et al., 2026)</text>

  <!-- ==================== PANEL A: TRAINING STEP (4, 2) ==================== -->
  <rect x="28" y="84" width="480" height="528" rx="14" fill="#fdfaf6" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#9a4a0c">(a) Training Step for (T, B) = (4, 2)</text>

  <!-- Loss top -->
  <rect x="130" y="134" width="160" height="32" rx="16" fill="#0e6b74"/>
  <text x="210" y="155" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Cross-Entropy Loss</text>
  <line x1="210" y1="184" x2="210" y2="172" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#tTeal)"/>

  <!-- Coda -->
  <rect x="115" y="186" width="190" height="44" rx="8" fill="#ffffff" stroke="#0e6b74" stroke-width="2"/>
  <text x="210" y="213" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#0e6b74">Coda C(s₄) (ℓ<tspan dy="3" font-size="10.5">c</tspan><tspan dy="-3"> layers)</tspan></text>
  <line x1="210" y1="248" x2="210" y2="236" stroke="#9a4a0c" stroke-width="2" marker-end="url(#tAmber)"/>

  <!-- Loop 4 (backprop) -->
  <rect x="115" y="250" width="190" height="42" rx="8" fill="#fef3c7" stroke="#9a4a0c" stroke-width="2"/>
  <text x="210" y="276" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#7c2d12">Loop 4 (Φ<tspan dy="3" font-size="10.5">θ</tspan><tspan dy="-3"> → s₄)</tspan></text>
  <line x1="210" y1="308" x2="210" y2="298" stroke="#9a4a0c" stroke-width="2" marker-end="url(#tAmber)"/>

  <!-- Loop 3 (backprop) -->
