  <text x="726" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Output s<tspan dy="3" font-size="11.5">t</tspan></text>
  <line x1="726" y1="194" x2="726" y2="178" stroke="#1f4e79" stroke-width="2" marker-end="url(#tBlue)"/>

