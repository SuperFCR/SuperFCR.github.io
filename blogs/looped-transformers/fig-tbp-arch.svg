  <line x1="48" y1="370" x2="366" y2="370" stroke="#b83b5e" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="102" y="357" width="216" height="26" rx="13" fill="#b83b5e"/>
  <text x="210" y="375" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">stop gradient on s₂ (s<tspan dy="3" font-size="10">T−B</tspan><tspan dy="-3">)</tspan></text>
  <line x1="210" y1="396" x2="210" y2="386" stroke="#64748b" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Loop 2 (forward only) -->
