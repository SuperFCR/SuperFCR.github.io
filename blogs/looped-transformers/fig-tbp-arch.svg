  <path d="M 726 476 L 866 476 L 866 372 L 736 372" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
  <path d="M 866 372 L 866 266 L 736 266" fill="none" stroke="#94a3b8" stroke-width="1.8"/>

