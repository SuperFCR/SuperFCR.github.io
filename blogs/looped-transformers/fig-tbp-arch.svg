  <line x1="670" y1="564" x2="670" y2="536" stroke="#1f4e79" stroke-width="2" marker-end="url(#tBlue)"/>
  <line x1="782" y1="564" x2="782" y2="536" stroke="#9a4a0c" stroke-width="2" marker-end="url(#tAmber)"/>
