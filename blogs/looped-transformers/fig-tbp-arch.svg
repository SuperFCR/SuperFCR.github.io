  <rect x="526" y="84" width="400" height="528" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1f4e79">(b) Loop t (Shared Weights θ)</text>

