  <rect x="626" y="392" width="200" height="38" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text x="726" y="416" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#1e40af">Attention (QK-norm)</text>
