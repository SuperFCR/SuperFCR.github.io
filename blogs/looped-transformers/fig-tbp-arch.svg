  <text x="1123" y="301" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e40af">2</text>
  <rect x="1165" y="282" width="112" height="28" rx="5" fill="#fef3c7" stroke="#9a4a0c" stroke-width="1.5"/>
  <text x="1221" y="301" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#7c2d12">4</text>

