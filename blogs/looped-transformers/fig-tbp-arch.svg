  <!-- Add circle top (above Feed-forward) -->
  <circle cx="726" cy="266" r="10" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
  <text x="726" y="271" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#475569">+</text>
