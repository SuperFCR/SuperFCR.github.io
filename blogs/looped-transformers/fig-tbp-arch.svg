  <path d="M 102 252 L 88 252 L 88 350 L 102 350" fill="none" stroke="#9a4a0c" stroke-width="2.5"/>
  <text x="78" y="298" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#9a4a0c">B = 2</text>
  <text x="78" y="315" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#9a4a0c">bwd</text>

