  <text x="210" y="421" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#475569">Loop 2 (fwd only → s₂)</text>
  <line x1="210" y1="452" x2="210" y2="440" stroke="#64748b" stroke-width="2" stroke-dasharray="3 2"/>

