  <text x="210" y="584" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#475569">Tokens ↑ · Evaluation executes all T loops</text>

