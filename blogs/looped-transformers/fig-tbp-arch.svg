  <text x="210" y="477" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#475569">Loop 1 (fwd only → s₁)</text>

  <!-- T-B=2 bracket on left -->
  <path d="M 102 398 L 88 398 L 88 490 L 102 490" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="78" y="440" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#64748b">T−B=2</text>
  <text x="78" y="456" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#64748b">no grad</text>

