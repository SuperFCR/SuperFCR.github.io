  <line x1="394" y1="271" x2="313" y2="271" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#tBlue)"/>
  <text x="414" y="405" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1f4e79" transform="rotate(90 414 405)">s₀ injection feeds Prelude grad via Loops 3–4</text>

