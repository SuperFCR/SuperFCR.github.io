<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="700" y="40" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1e293b">Truncated vs. Full BPTT: FLOP Accounting &amp; Effective-Parameter Scaling</text>
  <text x="700" y="65" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">Quantifying Xiong, Chen et al. (2026): per-loop backward cost (2× forward) vs. fitted exponent asymmetry (q ≈ 1.02 ≫ 2p ≈ 0.47)</text>

  <!-- ==================== LEFT PANEL: ISO-COMPUTE FLOP ACCOUNTING ==================== -->
  <rect x="28" y="92" width="600" height="516" rx="14" fill="#fdfaf6" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#9a4a0c">A. Recurrent FLOP Accounting: (2T + 4B) N_rec</text>
  <text x="52" y="147" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">1 forward loop = 2 N_rec · 1 backward loop = 4 N_rec (+6 N_once for Prelude+Coda)</text>

  <!-- Legend for stacked bars -->
  <rect x="52" y="164" width="16" height="16" rx="3" fill="#3b82f6"/>
  <text x="74" y="177" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">Forward loops (2T N_rec)</text>
  <rect x="268" y="164" width="16" height="16" rx="3" fill="#b45309"/>
  <text x="290" y="177" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">Backward loops (4B N_rec)</text>

  <!-- Bar 1: (8, 2) = 16F + 8B = 24 N_rec (16 px per N_rec -> max 384px) -->
  <text x="52" y="220" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1e293b">(T, B) = (8, 2)   Truncated BPTT</text>
  <rect x="52" y="232" width="256" height="38" rx="6" fill="#3b82f6"/>
  <rect x="308" y="232" width="128" height="38" rx="6" fill="#b45309"/>
  <text x="180" y="256" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">16 N_rec fwd</text>
  <text x="372" y="256" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">8 N_rec</text>
  <text x="448" y="256" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#334155">= 24 N_rec</text>
  <text x="52" y="289" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">240M FineWeb-Edu (17.2B tok): 2.2778 nats · g = 2.18</text>

  <!-- Equal bracket between (8,2) and (4,4) -->
  <rect x="52" y="314" width="552" height="106" rx="10" fill="#ecfdf5" stroke="#0e6b74" stroke-width="2"/>
  <text x="70" y="340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0e6b74">(T, B) = (4, 4)   Full BPTT  [EXACT ISO-COMPUTE WINNER]</text>
  <rect x="70" y="352" width="128" height="38" rx="6" fill="#3b82f6"/>
  <rect x="198" y="352" width="256" height="38" rx="6" fill="#b45309"/>
  <text x="134" y="376" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">8 N_rec</text>
  <text x="326" y="376" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff">16 N_rec bwd</text>
  <text x="466" y="376" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0e6b74">= 24 N_rec</text>
  <text x="70" y="409" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0f766e">2.2642 nats (−0.0136) · g = 2.50 · 8–14% frontier compute saved</text>

  <!-- Bar 3: (2, 2) = 4F + 8B = 12 N_rec -->
  <text x="52" y="454" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1e293b">(T, B) = (2, 2)   Best Looped Setting (Free N)</text>
  <rect x="52" y="466" width="64" height="36" rx="6" fill="#3b82f6"/>
  <rect x="116" y="466" width="128" height="36" rx="6" fill="#b45309"/>
  <text x="84" y="489" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <text x="180" y="489" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">8 N_rec bwd</text>
  <text x="256" y="489" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#334155">= 12 N_rec  (same FLOPs as (4, 1))</text>

  <!-- Summary note inside Panel A -->
  <rect x="52" y="522" width="552" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="68" y="547" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1e293b">Key Takeaway (Lemma D.2): minimize T<tspan dy="-4" font-size="11">−p</tspan><tspan dy="4"> B</tspan><tspan dy="-4" font-size="11">−q</tspan><tspan dy="4"> s.t. T + 2B = S</tspan></text>
  <text x="68" y="571" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">Whenever q ≥ 2p (here 1.022 ≥ 0.474), full BPTT T* = B* = S/3 is uniquely optimal.</text>

  <!-- ==================== RIGHT PANEL: g(T, B) CURVE ==================== -->
  <rect x="652" y="92" width="720" height="516" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="676" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#1f4e79">B. Effective-Size Multiplier g(T, B) = exp[c (1 − T<tspan dy="-5" font-size="13">−p</tspan><tspan dy="5"> B</tspan><tspan dy="-5" font-size="13">−q</tspan><tspan dy="5">)]</tspan></text>
  <text x="676" y="147" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">230-config fit (R² = 0.9992): c = 1.112, p = 0.237, q = 1.022, ceiling e^c ≈ 3.04</text>

  <!-- Plot axes: X=T in [1..8] -> x=775 + 75*(T-1) [775..1300]; Y=g in [1.0..4.4] -> y=600 - 100*g [500..160] -->
  <!-- Gridlines -->
  <line x1="775" y1="500" x2="1310" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="775" y1="500" x2="775" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="775" y1="400" x2="1310" y2="400" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="775" y1="300" x2="1310" y2="300" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="775" y1="200" x2="1310" y2="200" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Y tick labels -->
  <text x="760" y="505" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">1.0</text>
  <text x="760" y="405" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">2.0</text>
  <text x="760" y="305" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">3.0</text>
  <text x="760" y="205" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">4.0</text>
  <text x="710" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#334155" transform="rotate(-90 710 330)">Looping coefficient g(T, B)</text>

  <!-- X tick labels (T=1..8) -->
  <text x="775" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">1</text>
  <text x="850" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">2</text>
  <text x="925" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">3</text>
  <text x="1000" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">4</text>
  <text x="1150" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">6</text>
  <text x="1300" y="524" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">8</text>
  <text x="1040" y="550" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#334155">Forward loops T</text>

  <!-- Ceiling line e^c = 3.04 (y=296) -->
  <line x1="775" y1="296" x2="1310" y2="296" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="1308" y="286" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#475569">Fitted ceiling e^c ≈ 3.04</text>

  <!-- Untied copies y=T (1,1)->(775,500), (4.4,4.4)->(1030,160) -->
  <line x1="775" y1="500" x2="1030" y2="160" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="1040" y="182" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#64748b">Untied T copies</text>

  <!-- Full BPTT g(T, T) polyline -->
  <polyline points="775,500 850,409 925,370 1000,350 1075,337 1150,329 1225,324 1300,320" fill="none" stroke="#1f4e79" stroke-width="3.5"/>
  <!-- Full BPTT dots -->
  <circle cx="775" cy="500" r="6" fill="#1f4e79"/>
  <circle cx="850" cy="409" r="6.5" fill="#1f4e79"/>
  <circle cx="1000" cy="350" r="6.5" fill="#1f4e79"/>
  <circle cx="1300" cy="320" r="6.5" fill="#1f4e79"/>

  <!-- Labels for Full BPTT -->
  <text x="862" y="432" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1f4e79">(2,2): 1.91</text>
  <text x="1000" y="335" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1f4e79">(4,4): 2.50</text>
  <text x="1296" y="344" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1f4e79">(8,8): 2.80</text>

  <!-- Truncated g(T, 2) polyline -->
  <polyline points="850,409 925,401 1000,395 1075,391 1150,387 1225,385 1300,382" fill="none" stroke="#b45309" stroke-width="3"/>
  <circle cx="1000" cy="395" r="5.5" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <circle cx="1300" cy="382" r="5.5" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <text x="1000" y="422" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#9a4a0c">(4,2): 2.05</text>
  <text x="1296" y="406" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="600" fill="#9a4a0c">(8,2): 2.18</text>

  <!-- B=1 open markers: (2,1)=1.183 (y=482), (4,1)=1.365 (y=464) -->
  <circle cx="850" cy="482" r="5" fill="#ffffff" stroke="#b83b5e" stroke-width="2.5"/>
  <circle cx="1000" cy="464" r="5" fill="#ffffff" stroke="#b83b5e" stroke-width="2.5"/>
  <text x="862" y="486" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b83b5e">(2,1): 1.18</text>
  <text x="1012" y="468" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#b83b5e">(4,1): 1.36</text>

  <!-- Insight box bottom right -->
  <rect x="676" y="564" width="672" height="32" rx="8" fill="#eef4fa"/>
  <text x="1012" y="585" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1f4e79">At T=2: g(2,2) ≈ 1.91 ≈ 2 → most parameter savings (−27% N) with minimal compute premium (+8% C)</text>
</svg>
