<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" rx="16" fill="#ffffff"/>

  <defs>
    <marker id="sBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1f4e79"/>
    </marker>
    <marker id="sCoral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#b83b5e"/>
    </marker>
    <marker id="sTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0e6b74"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="38" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1e293b">SMELT Architecture: Compute-Matched MoE Stack &amp; 1/r Looped Block</text>
  <text x="700" y="63" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" fill="#64748b">Sparse MoE Transformer, middle layers Loop Twice — example parameters from 200M, S ≈ 95% cell (Wang, Zhang et al., 2026)</text>

  <!-- ==================== LEFT PANEL: BASELINE VS SMELT STACK ==================== -->
  <rect x="28" y="84" width="700" height="528" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="52" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18.5" font-weight="700" fill="#1f4e79">A. Three-Budget Matching (12 Physical Layers → 18 Executed)</text>

  <!-- Baseline column -->
  <rect x="52" y="132" width="290" height="398" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="52" y="132" width="290" height="44" rx="12" fill="#475569"/>
  <rect x="52" y="164" width="290" height="12" fill="#475569"/>
  <text x="197" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Unlooped Baseline (12L)</text>

  <rect x="76" y="196" width="242" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="197" y="221" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Layers 1–3 (Entry)</text>
  <text x="197" y="242" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#475569">H = 1280 · 192 experts (top-8)</text>

  <line x1="197" y1="254" x2="197" y2="274" stroke="#64748b" stroke-width="2" marker-end="url(#sBlue)"/>

  <rect x="76" y="280" width="242" height="148" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="197" y="340" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1e293b">Layers 4–9 (Middle 50%)</text>
  <text x="197" y="364" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Executed once (6 layers)</text>
  <text x="197" y="386" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#64748b">Residual scale = 1×</text>

  <line x1="197" y1="428" x2="197" y2="448" stroke="#64748b" stroke-width="2" marker-end="url(#sBlue)"/>

  <rect x="76" y="454" width="242" height="58" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="197" y="479" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Layers 10–12 (Exit)</text>
  <text x="197" y="500" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#475569">1.33B FLOPs/tok · 3.87B params</text>

  <!-- SMELT column -->
  <rect x="372" y="132" width="334" height="398" rx="12" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <rect x="372" y="132" width="334" height="44" rx="12" fill="#1f4e79"/>
  <rect x="372" y="164" width="334" height="12" fill="#1f4e79"/>
  <text x="539" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff">SMELT Looped (12L → 18L exec)</text>

  <rect x="396" y="192" width="286" height="48" rx="8" fill="#eef4fa" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="539" y="213" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#1f4e79">Layers 1–3 (Unshared Entry)</text>
  <text x="539" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">Narrowed H = 1056 · 288 experts (top-8)</text>

  <line x1="539" y1="240" x2="539" y2="256" stroke="#1f4e79" stroke-width="2" marker-end="url(#sBlue)"/>

  <!-- Visit 1 + Visit 2 shared block -->
  <rect x="396" y="262" width="286" height="72" rx="8" fill="#1f4e79"/>
  <text x="539" y="290" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">Visit 1: Layers 4–9 (Shared θ)</text>
  <text x="539" y="311" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#dbeafe">Residual ×1/2 · builds Q/K coordinates</text>

  <line x1="539" y1="334" x2="539" y2="358" stroke="#b83b5e" stroke-width="2.5" marker-end="url(#sCoral)"/>
  <text x="612" y="352" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#b83b5e">reuses θ</text>

  <rect x="396" y="364" width="286" height="72" rx="8" fill="#0e6b74"/>
  <text x="539" y="392" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">Visit 2: Layers 4–9 (Same θ)</text>
  <text x="539" y="413" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#ccfbf1">Residual ×1/2 · re-routes &amp; cuts sink</text>

  <line x1="539" y1="436" x2="539" y2="454" stroke="#1f4e79" stroke-width="2" marker-end="url(#sBlue)"/>

  <rect x="396" y="460" width="286" height="54" rx="8" fill="#eef4fa" stroke="#1f4e79" stroke-width="1.5"/>
  <text x="539" y="482" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#1f4e79">Layers 10–12 (Unshared Exit)</text>
  <text x="539" y="502" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">1.37B FLOPs (+2.9%) · 3.89B (+0.4%)</text>

  <!-- Bottom parity strip in Panel A -->
  <rect x="52" y="544" width="654" height="52" rx="8" fill="#dbeafe"/>
  <text x="379" y="567" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#1e3a8a">KV Cache matched within 4% via smaller head size + higher GQA ratio</text>
  <text x="379" y="586" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#1e40af">Middle-half (50%) ×2 beats full-stack looping and beats 3× / 4× passes under equal FLOPs</text>

  <!-- ==================== RIGHT PANEL: INSIDE ONE LOOPED LAYER ==================== -->
  <rect x="748" y="84" width="624" height="528" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="774" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18.5" font-weight="700" fill="#1f4e79">B. Inside Shared Layer ℓ (Pre-Norm + 1/r Scaling)</text>

  <!-- Input state -->
  <rect x="850" y="138" width="160" height="40" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="930" y="164" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#1f4e79">Input x<tspan dy="4" font-size="11.5">ℓ</tspan></text>

  <!-- Residual bypass line left -->
  <line x1="930" y1="178" x2="930" y2="200" stroke="#1f4e79" stroke-width="2"/>
  <path d="M 850 158 L 796 158 L 796 346 L 910 346" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#sBlue)"/>

  <!-- RMSNorm 1 -->
  <rect x="850" y="200" width="160" height="34" rx="7" fill="#e2e8f0"/>
  <text x="930" y="222" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e293b">RMSNorm</text>
  <line x1="930" y1="234" x2="930" y2="250" stroke="#1f4e79" stroke-width="2"/>

  <!-- Attention GQA -->
  <rect x="830" y="250" width="200" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="930" y="278" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e40af">Attention (GQA)</text>
  <line x1="930" y1="294" x2="930" y2="306" stroke="#1f4e79" stroke-width="2"/>

  <!-- x 1/2 badge -->
  <rect x="886" y="302" width="88" height="24" rx="12" fill="#b83b5e"/>
  <text x="930" y="319" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">× 1/r (1/2)</text>
  <line x1="930" y1="326" x2="930" y2="334" stroke="#1f4e79" stroke-width="2"/>

  <!-- Add circle 1 -->
  <circle cx="930" cy="346" r="14" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="930" y="352" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1f4e79">+</text>

  <!-- Second residual bypass -->
  <path d="M 930 360 L 930 374" stroke="#1f4e79" stroke-width="2"/>
  <path d="M 916 346 L 796 346 L 796 544 L 910 544" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#sBlue)"/>

  <!-- RMSNorm 2 -->
  <rect x="850" y="374" width="160" height="34" rx="7" fill="#e2e8f0"/>
  <text x="930" y="396" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e293b">RMSNorm</text>
  <line x1="930" y1="408" x2="930" y2="424" stroke="#1f4e79" stroke-width="2"/>

  <!-- MoE + Router side branch -->
  <rect x="830" y="424" width="200" height="58" rx="8" fill="#ecfdf5" stroke="#0e6b74" stroke-width="2"/>
  <text x="930" y="449" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#0e6b74">MoE FFN</text>
  <text x="930" y="470" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#134e4a">Top-8 of N<tspan dy="3" font-size="10">exp</tspan><tspan dy="-3"> (narrow H)</tspan></text>

  <!-- Router callout to right of MoE -->
  <rect x="1064" y="426" width="170" height="54" rx="8" fill="#ffffff" stroke="#0e6b74" stroke-width="1.5"/>
  <text x="1149" y="449" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0e6b74">Router (top-k)</text>
  <text x="1149" y="469" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">Dynamic per visit</text>
  <line x1="1064" y1="453" x2="1038" y2="453" stroke="#0e6b74" stroke-width="2" marker-end="url(#sTeal)"/>

  <line x1="930" y1="482" x2="930" y2="496" stroke="#1f4e79" stroke-width="2"/>
  <!-- x 1/2 badge 2 -->
  <rect x="886" y="494" width="88" height="24" rx="12" fill="#b83b5e"/>
  <text x="930" y="511" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ffffff">× 1/r (1/2)</text>
  <line x1="930" y1="518" x2="930" y2="528" stroke="#1f4e79" stroke-width="2"/>

  <!-- Add circle 2 -->
  <circle cx="930" cy="544" r="14" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="930" y="550" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#1f4e79">+</text>
  <line x1="944" y1="544" x2="1008" y2="544" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#sBlue)"/>

  <rect x="1016" y="524" width="180" height="40" rx="8" fill="#1f4e79"/>
  <text x="1106" y="550" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">Output x<tspan dy="4" font-size="11.5">ℓ+1</tspan></text>

  <!-- Right-side callout cards in Panel B -->
  <rect x="1064" y="142" width="286" height="148" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="1080" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e293b">Why Scale Looped Writes by 1/r?</text>
  <text x="1080" y="196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155">• Tied visits write correlated Δx</text>
  <text x="1080" y="218" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155">• Unscaled loop inflates ‖x<tspan dy="3" font-size="10">ℓ</tspan><tspan dy="-3">‖</tspan></text>
  <text x="1080" y="240" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155">• 1/2 factor keeps stream scale</text>
  <text x="1080" y="262" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#0e6b74" font-weight="600">• Non-looped L1–3, 10–12 keep 1×</text>

  <rect x="1064" y="308" width="286" height="100" rx="10" fill="#fff1f2" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="1080" y="336" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#9f1239">Eq. (8)–(9) Sublayer Writes</text>
  <text x="1080" y="362" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155">Δx<tspan dy="3" font-size="10">attn</tspan><tspan dy="-3"> = (1/r) Attn(LN(x</tspan><tspan dy="3" font-size="10">ℓ</tspan><tspan dy="-3">))</tspan></text>
  <text x="1080" y="384" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#334155">Δx<tspan dy="3" font-size="10">moe</tspan><tspan dy="-3"> = (1/r) MoE(LN(x</tspan><tspan dy="3" font-size="10">ℓ</tspan><tspan dy="-3"> + Δx</tspan><tspan dy="3" font-size="10">attn</tspan><tspan dy="-3">))</tspan></text>
</svg>
