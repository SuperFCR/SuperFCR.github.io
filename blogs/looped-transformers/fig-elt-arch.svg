<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <rect width="1400" height="640" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="700" y="38" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22.5" font-weight="700" fill="#1e293b">ELT: Elastic Looped Transformers — Intra-Loop Self Distillation (ILSD) &amp; Any-Time Inference</text>
  <text x="700" y="64" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#64748b">Reusing one N-layer weight block Θ inside every sampling step decouples parameters from compute and unlocks test-time depth elasticity</text>

  <defs>
    <marker id="eBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#1f4e79"/>
    </marker>
    <marker id="eOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#c2410c"/>
    </marker>
    <marker id="eTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0e6b74"/>
    </marker>
    <marker id="ePink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#be123c"/>
    </marker>
  </defs>

  <!-- ==================== LEFT PANEL: ILSD TRAINING ==================== -->
  <rect x="28" y="86" width="660" height="528" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="28" y="86" width="660" height="46" rx="14" fill="#1f4e79"/>
  <rect x="28" y="118" width="660" height="14" fill="#1f4e79"/>
  <text x="358" y="116" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Training: Dual-Path Prefix ILSD (Zero Extra Forward Pass)</text>

  <!-- Input pill -->
  <rect x="78" y="148" width="164" height="36" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="160" y="171" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#1f4e79">Input X_k (or x_t)</text>
  <line x1="160" y1="184" x2="160" y2="205" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#eBlue)"/>

  <!-- Shared-weight container -->
  <rect x="52" y="200" width="216" height="260" rx="12" fill="none" stroke="#1f4e79" stroke-width="1.8" stroke-dasharray="6 4"/>

  <!-- Loop 1 -->
  <rect x="70" y="210" width="180" height="42" rx="8" fill="#eef4fa" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="160" y="236" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">Loop 1:  g_Θ (N layers)</text>

  <!-- Dashed connector to L_int -->
  <line x1="160" y1="252" x2="160" y2="280" stroke="#1f4e79" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#eBlue)"/>

  <!-- Student L_int -->
  <rect x="64" y="284" width="192" height="58" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2.5"/>
  <text x="160" y="309" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#9a3412">Student @ L_int (g_Θ)</text>
  <text x="160" y="329" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c2410c">L_int ~ Uniform(L_min, L_max)</text>

  <!-- Student Head + Loss -->
  <line x1="256" y1="313" x2="298" y2="313" stroke="#c2410c" stroke-width="2.5" marker-end="url(#eOrange)"/>
  <rect x="304" y="291" width="106" height="44" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
  <text x="357" y="311" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">Shared</text>
  <text x="357" y="327" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">Head</text>

  <line x1="410" y1="313" x2="444" y2="313" stroke="#c2410c" stroke-width="2.5" marker-end="url(#eOrange)"/>
  <rect x="450" y="282" width="218" height="62" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="559" y="308" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#9a3412">λ L^GT_int + (1−λ) L^dist_int</text>
  <text x="559" y="330" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#7c2d12">Linear schedule λ: 1 → 0</text>

  <!-- Dashed connector to L_max -->
  <line x1="160" y1="342" x2="160" y2="390" stroke="#1f4e79" stroke-width="2.2" stroke-dasharray="4 3" marker-end="url(#eBlue)"/>

  <!-- Teacher L_max -->
  <rect x="64" y="394" width="192" height="58" rx="10" fill="#1f4e79"/>
  <text x="160" y="419" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">Teacher @ L_max (g_Θ)</text>
  <text x="160" y="439" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#dbeafe">Full training loop depth</text>

  <!-- Teacher Head + Loss -->
  <line x1="256" y1="423" x2="298" y2="423" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#eBlue)"/>
  <rect x="304" y="401" width="106" height="44" rx="8" fill="#ffffff" stroke="#1f4e79" stroke-width="1.8"/>
  <text x="357" y="421" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1f4e79">Shared</text>
  <text x="357" y="437" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#1f4e79">Head</text>

  <line x1="410" y1="423" x2="444" y2="423" stroke="#1f4e79" stroke-width="2.5" marker-end="url(#eBlue)"/>
  <rect x="450" y="396" width="218" height="54" rx="10" fill="#eef4fa" stroke="#1f4e79" stroke-width="2"/>
  <text x="559" y="420" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">L^GT_max (Teacher)</text>
  <text x="559" y="439" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">CE (MaskGIT) / sig-MSE (DiT)</text>

  <!-- Self-distillation vertical arrow with stop-grad pill -->
  <line x1="559" y1="396" x2="559" y2="350" stroke="#be123c" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#ePink)"/>
  <rect x="506" y="359" width="106" height="22" rx="6" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="559" y="374" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#9f1239">stop_grad (sg)</text>

  <text x="160" y="478" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#1f4e79">All L_max iterations share the same weights Θ</text>

  <!-- Left bottom summary card -->
  <rect x="48" y="494" width="620" height="104" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#1e293b"><tspan font-weight="700" fill="#1f4e79">Zero Extra Forward Pass:</tspan> student path L_int is a strict prefix of teacher L_max.</text>
  <text x="66" y="547" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#1e293b"><tspan font-weight="700" fill="#c2410c">Gradient Synergy:</tspan> both branches update Θ, compressing refinement into early loops.</text>
  <text x="66" y="574" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" fill="#1e293b"><tspan font-weight="700" fill="#0e6b74">Training Profile:</tspan> −34% peak HBM (5.1 vs 7.7 GB on TPU v6e) · same 130 ms step time.</text>

  <!-- ==================== RIGHT PANEL: ANY-TIME INFERENCE ==================== -->
  <rect x="712" y="86" width="660" height="528" rx="14" fill="#f5fbfb" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="712" y="86" width="660" height="46" rx="14" fill="#0e6b74"/>
  <rect x="712" y="118" width="660" height="14" fill="#0e6b74"/>
  <text x="1042" y="116" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Any-Time Inference: One Trained Θ, Elastic Compute Budget L</text>

  <!-- Memory wall hardware card -->
  <rect x="732" y="148" width="620" height="66" rx="10" fill="#ffffff" stroke="#0e6b74" stroke-width="1.8"/>
  <text x="1042" y="175" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#0e6b74">Breaking the Memory Wall with 4× Parameter Reduction</text>
  <text x="1042" y="199" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">Compact Θ fits on-chip · Up to L× higher arithmetic intensity → 2.9×–3.5× TPU v6e throughput</text>

  <!-- Unrolled horizontal chain -->
  <rect x="728" y="246" width="54" height="46" rx="8" fill="#ffffff" stroke="#0e6b74" stroke-width="1.8"/>
  <text x="755" y="274" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#0e6b74">X_k</text>
  <line x1="782" y1="269" x2="804" y2="269" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#eTeal)"/>

  <!-- Col 1: L=2 -->
  <rect x="810" y="242" width="104" height="54" rx="10" fill="#ccfbf1" stroke="#0e6b74" stroke-width="2"/>
  <text x="862" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#134e4a">g_Θ</text>
  <text x="862" y="285" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0f766e">to L = 2</text>
  <line x1="914" y1="269" x2="944" y2="269" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#eTeal)"/>

  <line x1="862" y1="296" x2="862" y2="336" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="814" y="340" width="96" height="34" rx="7" fill="#ffffff" stroke="#0e6b74" stroke-width="1.5"/>
  <text x="862" y="362" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0e6b74">Head</text>
  <line x1="862" y1="374" x2="862" y2="404" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="799" y="408" width="126" height="62" rx="9" fill="#ffffff" stroke="#0e6b74" stroke-width="1.6"/>
  <text x="862" y="432" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#134e4a">Fast Edge</text>
  <text x="862" y="454" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">Low FLOPs / step</text>

  <!-- Col 2: L=4 -->
  <rect x="950" y="242" width="104" height="54" rx="10" fill="#99f6e4" stroke="#0e6b74" stroke-width="2"/>
  <text x="1002" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#134e4a">g_Θ</text>
  <text x="1002" y="285" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0f766e">to L = 4</text>
  <line x1="1054" y1="269" x2="1084" y2="269" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#eTeal)"/>

  <line x1="1002" y1="296" x2="1002" y2="336" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="954" y="340" width="96" height="34" rx="7" fill="#ffffff" stroke="#0e6b74" stroke-width="1.5"/>
  <text x="1002" y="362" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0e6b74">Head</text>
  <line x1="1002" y1="374" x2="1002" y2="404" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="939" y="408" width="126" height="62" rx="9" fill="#ffffff" stroke="#0e6b74" stroke-width="1.6"/>
  <text x="1002" y="432" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#134e4a">Balanced</text>
  <text x="1002" y="454" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">FID 2.0 / FVD 72.8</text>

  <!-- Col 3: L=6-8 -->
  <rect x="1090" y="242" width="104" height="54" rx="10" fill="#0e6b74"/>
  <text x="1142" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#ffffff">g_Θ</text>
  <text x="1142" y="285" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#ccfbf1">to L = 6–8</text>
  <line x1="1194" y1="269" x2="1224" y2="269" stroke="#0e6b74" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#eTeal)"/>

  <line x1="1142" y1="296" x2="1142" y2="336" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="1094" y="340" width="96" height="34" rx="7" fill="#ffffff" stroke="#0e6b74" stroke-width="1.5"/>
  <text x="1142" y="362" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0e6b74">Head</text>
  <line x1="1142" y1="374" x2="1142" y2="404" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="1079" y="408" width="126" height="62" rx="9" fill="#ecfdf5" stroke="#0e6b74" stroke-width="2"/>
  <text x="1142" y="432" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0e6b74">High Fidelity</text>
  <text x="1142" y="454" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#134e4a">Pareto Frontier</text>

  <!-- Col 4: L > L_max -->
  <rect x="1230" y="242" width="104" height="54" rx="10" fill="#ffffff" stroke="#0e6b74" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1282" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" fill="#0e6b74">g_Θ</text>
  <text x="1282" y="285" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0f766e">L &gt; L_max</text>

  <line x1="1282" y1="296" x2="1282" y2="336" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="1234" y="340" width="96" height="34" rx="7" fill="#ffffff" stroke="#0e6b74" stroke-width="1.5"/>
  <text x="1282" y="362" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0e6b74">Head</text>
  <line x1="1282" y1="374" x2="1282" y2="404" stroke="#0e6b74" stroke-width="2.2" marker-end="url(#eTeal)"/>
  <rect x="1219" y="408" width="126" height="62" rx="9" fill="#ffffff" stroke="#0e6b74" stroke-width="1.6"/>
  <text x="1282" y="432" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#134e4a">Extrapolate</text>
  <text x="1282" y="454" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" fill="#475569">FVD 69.2 (L=6)</text>

  <!-- Right bottom comparison strip -->
  <rect x="732" y="494" width="620" height="104" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="750" y="520" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="700" fill="#9f1239">Why ILSD Matters vs. Vanilla Looping &amp; Step Reduction:</text>
  <text x="750" y="547" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">• Vanilla looping without ILSD fails whenever L ≠ L_max (DiT FID explodes to 120–200 at L ≠ 8).</text>
  <text x="750" y="574" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">• Orthogonal to step distillation: few-step cuts sampling steps K; ELT scales intra-step loops L.</text>
</svg>
