<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="1400" height="620" rx="16" fill="#ffffff"/>

  <!-- Header -->
  <text x="700" y="40" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#1e293b">Inkling 2 Mini: Dual-Path Attention Residuals &amp; the d_2027 Loop Switch</text>
  <text x="700" y="65" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">Zooming into Loop 2, Layer 13 (first layer of Block 3) and Goodfire's block-coordination circuit</text>

  <defs>
    <marker id="dBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="dPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#b83b5e"/>
    </marker>
    <marker id="dTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0e6b74"/>
    </marker>
  </defs>

  <!-- ==================== ROW 1: LOOP 1 MEMORY ==================== -->
  <rect x="34" y="88" width="1332" height="126" rx="14" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="58" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#9f1239">Loop 1 Outputs Stored for Cross-Loop Reads</text>

  <rect x="58" y="132" width="440" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="278" y="159" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#334155">v₂[1]: Block 2 Sum (Layers 7–12)</text>
  <text x="278" y="182" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#64748b">Accumulated sum of L7–12 attention + MoE writes</text>

  <rect x="546" y="132" width="796" height="64" rx="10" fill="#ffffff" stroke="#b83b5e" stroke-width="2.5"/>
  <text x="944" y="159" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#9f1239">v₃[1]: Block 3 Sum (Layers 13–18)   [Tagged at L18 with +d_2027 spike!]</text>
  <text x="944" y="182" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#881337">MoE neurons in end layer 18 write massive +d_2027 signal → biases β₃ ≫ β₂ toward Block 3</text>

  <!-- ==================== ROW 2: LOOP 2 LAYER 13 DUAL-PATH DATAFLOW ==================== -->
  <rect x="34" y="230" width="1332" height="224" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1f4e79">Loop 2 · Inside Layer 13 (Start of Block 3): Combining Within-Loop Context &amp; "Future" Physical Layers</text>

  <!-- Left column: Current loop depth-wise sources -->
  <rect x="58" y="276" width="320" height="156" rx="10" fill="#eef4fa" stroke="#3b82f6" stroke-width="2"/>
  <text x="218" y="302" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Depth-wise Attention Sources (t = 2)</text>
  <rect x="76" y="314" width="136" height="32" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="144" y="335" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">v₀ (Embed)</text>
  <rect x="224" y="314" width="136" height="32" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="292" y="335" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e3a8a">v₁ (L1–6)</text>
  <rect x="76" y="356" width="284" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="218" y="378" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">v₂[2]: Loop 2 Block 2 (L7–12)</text>
  <text x="218" y="415" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1e40af">x = Σ α_j RMSNorm(v_j)</text>

  <!-- Arrow Depth-wise -> Mixer -->
  <line x1="378" y1="354" x2="452" y2="354" stroke="#2563eb" stroke-width="3" marker-end="url(#dBlue)"/>

  <!-- Middle-left: Gated Mixer -->
  <rect x="462" y="294" width="320" height="122" rx="12" fill="#ffffff" stroke="#0e6b74" stroke-width="2.5"/>
  <text x="622" y="324" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0e6b74">Channel-Gated Fusion</text>
  <text x="622" y="352" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1e293b">x' = κ ⊙ x  +  γ ⊙ m</text>
  <text x="622" y="378" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#475569">64-d bottleneck P[x̂; m̂] → κ ∈ (0,2), γ ∈ (−1,1)</text>
  <text x="622" y="400" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#0e6b74">Init γ = 0 (starts like unlooped)</text>

  <!-- Cross-loop reader box on right -->
  <rect x="866" y="276" width="476" height="156" rx="10" fill="#fff1f2" stroke="#b83b5e" stroke-width="2"/>
  <text x="1104" y="302" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#9f1239">Cross-Loop Attention Readers (4 per layer)</text>
  <text x="1104" y="328" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#334155">Dedicated queries u_Q, u_K, u_V, u_MoE score v̂₂[1] vs v̂₃[1]</text>
  <text x="1104" y="354" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#881337">β₃ = σ(u_s · (v̂₃[1] − v̂₂[1]) / √2304)</text>
  <text x="1104" y="382" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#b83b5e">d_2027 alone drives 17% (Q), 19% (V), 11% (K), 6% (MoE)</text>
  <text x="1104" y="406" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#64748b">Block 3 attends almost exclusively to v₃[1] (incl. L18!)</text>

  <!-- Arrows from Loop 1 to Cross-loop box & Cross-loop box to Mixer -->
  <polyline points="278,196 278,214 1104,214 1104,270" fill="none" stroke="#b83b5e" stroke-width="2.5" marker-end="url(#dPink)"/>
  <line x1="944" y1="196" x2="944" y2="270" stroke="#b83b5e" stroke-width="3" marker-end="url(#dPink)"/>
  <line x1="866" y1="354" x2="790" y2="354" stroke="#b83b5e" stroke-width="3" marker-end="url(#dPink)"/>

  <!-- ==================== ROW 3: COORD 2027 THREE-LOOP LIFECYCLE ==================== -->
  <rect x="34" y="470" width="1332" height="124" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="58" y="498" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#1e293b">How Physical Layer 18 Flips Coordinate d_2027 Across the Three Loops (Mean RMS-norm = +32.4 ≈ 46% of ‖v‖²)</text>

  <rect x="58" y="514" width="390" height="64" rx="10" fill="#ffffff" stroke="#b83b5e" stroke-width="2"/>
  <text x="253" y="540" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#9f1239">Loop 1 · Layer 18:  Massive +Spike</text>
  <text x="253" y="563" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Tags Block 3 so Loop 2 selects v₃[1]</text>

  <line x1="448" y1="546" x2="494" y2="546" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#dTeal)"/>

  <rect x="502" y="514" width="390" height="64" rx="10" fill="#ffffff" stroke="#b83b5e" stroke-width="2"/>
  <text x="697" y="540" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#9f1239">Loop 2 · Layer 18:  Positive +Spike</text>
  <text x="697" y="563" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Refreshes Block 3 tag for Loop 3 readers</text>

  <line x1="892" y1="546" x2="938" y2="546" stroke="#0e6b74" stroke-width="2.5" marker-end="url(#dTeal)"/>

  <rect x="946" y="514" width="396" height="64" rx="10" fill="#ecfdf5" stroke="#0e6b74" stroke-width="2"/>
  <text x="1144" y="540" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#0e6b74">Loop 3 · Layer 18:  Negative −Spike</text>
  <text x="1144" y="563" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#134e4a">Same weights clean up tag before Coda (Block 4)</text>
</svg>
