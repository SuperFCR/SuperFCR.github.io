<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Duet-Translator RSI cost and latency results</title>
  <desc>Closed-loop Recursive Self-Improvement workflow and simulated DeepSeek V4 Flash latency improvements across six reading scenarios from baseline through Round 5 and Round 6.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>

  <!-- Top strip: closed-loop RSI workflow -->
  <rect x="32" y="20" width="1536" height="96" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="56" y="48" font-size="18" font-weight="700" fill="#205488" letter-spacing="0.8">CLOSED-LOOP RSI WORKFLOW</text>
  <text x="1544" y="48" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">6 iterative rounds + spec audit</text>

  <g font-size="18" font-weight="600" text-anchor="middle">
    <rect x="56" y="64" width="204" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="158" y="89" fill="#0f172a">1. Hypothesize</text>
    <line x1="264" y1="83" x2="292" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <rect x="298" y="64" width="226" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="411" y="89" fill="#0f172a">2. Patch Extension</text>
    <line x1="528" y1="83" x2="556" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <rect x="562" y="64" width="320" height="38" rx="8" fill="#eef4fb" stroke="#93b4d8" stroke-width="1.8"/>
    <text x="722" y="89" fill="#0f2c4c">3. Playwright + llm-sim.mjs</text>
    <line x1="886" y1="83" x2="914" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <rect x="920" y="64" width="302" height="38" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
    <text x="1071" y="89" fill="#0f172a">4. Diff vs. Frozen Baseline</text>
    <line x1="1226" y1="83" x2="1254" y2="83" stroke="#64748b" stroke-width="2" marker-end="url(#flow-arrow)"/>

    <rect x="1260" y="64" width="284" height="38" rx="8" fill="#f0fdfa" stroke="#78c4b8" stroke-width="1.8"/>
    <text x="1402" y="89" fill="#0f766e">5. Keep Wins / Revert</text>
  </g>

  <!-- Chart header and legend -->
  <text x="32" y="160" font-size="24" font-weight="700" fill="#0f172a">End-to-End Latency Across Reading Scenarios <tspan font-size="18" font-weight="500" fill="#64748b">(seconds, lower is better)</tspan></text>

  <g font-size="18" font-weight="600">
    <rect x="786" y="143" width="18" height="18" rx="4" fill="#94a3b8"/>
    <text x="812" y="159" fill="#475569">Baseline</text>
    <rect x="920" y="143" width="18" height="18" rx="4" fill="#205488"/>
    <text x="946" y="159" fill="#205488">After 5-Round RSI</text>
    <rect x="1146" y="143" width="18" height="18" rx="4" fill="#0f766e"/>
    <text x="1172" y="159" fill="#0f766e">After Round 6 (Jump + Previews)</text>
  </g>

  <!-- Plot gridlines (0..8s @ 110px/s starting x=420) -->
  <g stroke="#e2e8f0" stroke-width="1.5">
    <line x1="420" y1="190" x2="420" y2="664" stroke="#94a3b8"/>
    <line x1="640" y1="190" x2="640" y2="664" stroke-dasharray="5 5"/>
    <line x1="860" y1="190" x2="860" y2="664" stroke-dasharray="5 5"/>
    <line x1="1080" y1="190" x2="1080" y2="664" stroke-dasharray="5 5"/>
    <line x1="1300" y1="190" x2="1300" y2="664" stroke-dasharray="5 5"/>
    <line x1="1520" y1="190" x2="1520" y2="664" stroke-dasharray="5 5"/>
  </g>
  <!-- Group separator hairlines -->
  <g stroke="#f1f5f9" stroke-width="1.5">
    <line x1="32" y1="268" x2="1568" y2="268"/>
    <line x1="32" y1="346" x2="1568" y2="346"/>
    <line x1="32" y1="424" x2="1568" y2="424"/>
    <line x1="32" y1="502" x2="1568" y2="502"/>
    <line x1="32" y1="580" x2="1568" y2="580"/>
  </g>

  <!-- Scenario 1: Open page · first segment -->
  <text x="402" y="234" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Open page · first segment</text>
  <rect x="420" y="198" width="274" height="17" rx="4" fill="#94a3b8"/>
  <text x="704" y="213" font-size="18" font-weight="600" fill="#64748b">2.49 s</text>
  <rect x="420" y="220" width="108" height="17" rx="4" fill="#205488"/>
  <text x="538" y="235" font-size="18" font-weight="600" fill="#205488">0.98 s</text>
  <rect x="420" y="242" width="86" height="17" rx="4" fill="#0f766e"/>
  <text x="516" y="257" font-size="18" font-weight="700" fill="#0f766e">0.78 s (−69%)</text>

  <!-- Scenario 2: Open page · first screen -->
  <text x="402" y="312" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Open page · first screen</text>
  <rect x="420" y="276" width="630" height="17" rx="4" fill="#94a3b8"/>
  <text x="1060" y="291" font-size="18" font-weight="600" fill="#64748b">5.73 s</text>
  <rect x="420" y="298" width="364" height="17" rx="4" fill="#205488"/>
  <text x="794" y="313" font-size="18" font-weight="600" fill="#205488">3.31 s</text>
  <rect x="420" y="320" width="234" height="17" rx="4" fill="#0f766e"/>
  <text x="664" y="335" font-size="18" font-weight="700" fill="#0f766e">2.13 s (−63%)</text>

  <!-- Scenario 3: Revisit · warm cache -->
  <text x="402" y="390" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Revisit · warm cache</text>
  <rect x="420" y="354" width="172" height="17" rx="4" fill="#94a3b8"/>
  <text x="602" y="369" font-size="18" font-weight="600" fill="#64748b">1.56 s</text>
  <rect x="420" y="376" width="17" height="17" rx="4" fill="#205488"/>
  <text x="447" y="391" font-size="18" font-weight="600" fill="#205488">0.15 s (0 req)</text>
  <rect x="420" y="398" width="17" height="17" rx="4" fill="#0f766e"/>
  <text x="447" y="413" font-size="18" font-weight="700" fill="#0f766e">0.15 s (−90%, 0 req)</text>

  <!-- Scenario 4: Fast skim · stop wait (p90) -->
  <text x="402" y="468" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Fast skim · stop wait (p90)</text>
  <rect x="420" y="432" width="856" height="17" rx="4" fill="#94a3b8"/>
  <text x="1286" y="447" font-size="18" font-weight="600" fill="#64748b">7.78 s</text>
  <rect x="420" y="454" width="462" height="17" rx="4" fill="#205488"/>
  <text x="892" y="469" font-size="18" font-weight="600" fill="#205488">4.20 s</text>
  <rect x="420" y="476" width="251" height="17" rx="4" fill="#0f766e"/>
  <text x="681" y="491" font-size="18" font-weight="700" fill="#0f766e">2.28 s (−71%)</text>

  <!-- Scenario 5: Forum (150 comments) · 1st screen -->
  <text x="402" y="546" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Forum (150 comments) · 1st screen</text>
  <rect x="420" y="510" width="884" height="17" rx="4" fill="#94a3b8"/>
  <text x="1314" y="525" font-size="18" font-weight="600" fill="#64748b">8.04 s</text>
  <rect x="420" y="532" width="472" height="17" rx="4" fill="#205488"/>
  <text x="902" y="547" font-size="18" font-weight="600" fill="#205488">4.29 s</text>
  <rect x="420" y="554" width="360" height="17" rx="4" fill="#0f766e"/>
  <text x="790" y="569" font-size="18" font-weight="700" fill="#0f766e">3.27 s (−59%)</text>

  <!-- Scenario 6: Jump (A -> B -> C, c=6) · mean wait -->
  <text x="402" y="624" font-size="19" font-weight="600" fill="#1e293b" text-anchor="end">Jump (A &#8594; B &#8594; C, c=6) · mean wait</text>
  <rect x="420" y="597" width="526" height="17" rx="4" fill="#94a3b8"/>
  <text x="956" y="612" font-size="18" font-weight="600" fill="#64748b">4.78 s (pre-R6)</text>
  <rect x="420" y="621" width="173" height="17" rx="4" fill="#0f766e"/>
  <text x="603" y="636" font-size="18" font-weight="700" fill="#0f766e">1.57 s (−67%)</text>

  <!-- X-axis tick labels -->
  <g font-size="18" fill="#64748b" text-anchor="middle">
    <text x="420" y="690">0 s</text>
    <text x="640" y="690">2 s</text>
    <text x="860" y="690">4 s</text>
    <text x="1080" y="690">6 s</text>
    <text x="1300" y="690">8 s</text>
    <text x="1520" y="690">10 s</text>
  </g>

  <!-- Bottom note -->
  <rect x="32" y="710" width="1536" height="36" rx="8" fill="#f8fafc"/>
  <text x="800" y="734" font-size="18" fill="#475569" text-anchor="middle">Simulated DeepSeek V4 Flash (600 ms TTFT, 45 tok/s, 64-tok prefix cache). 4-scenario total cost: $0.003644 &#8594; $0.003544 (R5) &#8594; $0.003776 (R6).</text>
</svg>
