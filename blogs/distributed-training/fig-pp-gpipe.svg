<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <pattern id="bubbleHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f1ece3"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#dfd7c9" stroke-width="3"/>
    </pattern>
    <marker id="arrP2P" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1f6b63"/>
    </marker>
  </defs>

  <rect width="1600" height="700" rx="16" fill="#fcfaf6" stroke="#ddd6ca" stroke-width="2"/>

  <!-- Header -->
  <text x="48" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b2230">Pipeline Parallelism: Naive Sequential vs. GPipe Micro-Batching (P = 4 Stages)</text>
  <text x="48" y="84" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#5b6472">Splitting a batch into M = 4 micro-batches overlaps P2P forward/backward waves and shrinks bubble ratio from 75% to (P−1)/(M+P−1) = 42.9%</text>

  <!-- STRIP 1: NAIVE MODEL PARALLEL -->
  <rect x="40" y="106" width="1520" height="202" rx="12" fill="#ffffff" stroke="#d8d1c4" stroke-width="1.5"/>
  <text x="64" y="138" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#1b2230">1. Naive Sequential Execution (M = 1)</text>
  <rect x="1156" y="118" width="380" height="32" rx="6" fill="#faece3"/>
  <text x="1346" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#9a461e">Bubble = (P − 1) / P = 3/4 = 75.0%</text>

  <!-- 8 slots across width 1200 (x=220..1420, slot=150) rows at y=156,192,228,264 h=32 -->
  <g font-family="Inter, sans-serif" font-size="16" font-weight="600">
    <text x="64" y="178" fill="#334155">GPU 0 (Stage 0)</text>
    <text x="64" y="214" fill="#334155">GPU 1 (Stage 1)</text>
    <text x="64" y="250" fill="#334155">GPU 2 (Stage 2)</text>
    <text x="64" y="286" fill="#334155">GPU 3 (Stage 3)</text>
  </g>

  <!-- Bubble background strips for Naive (x=220..1300 width 1080 = 8 * 135) -->
  <rect x="220" y="156" width="1080" height="32" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="192" width="1080" height="32" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="228" width="1080" height="32" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="264" width="1080" height="32" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>

  <!-- Naive Active cells (width 135 each) -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">
    <rect x="220" y="156" width="133" height="32" rx="5" fill="#23476a"/><text x="286" y="178">F</text>
    <rect x="355" y="192" width="133" height="32" rx="5" fill="#23476a"/><text x="421" y="214">F</text>
    <rect x="490" y="228" width="133" height="32" rx="5" fill="#23476a"/><text x="556" y="250">F</text>
    <rect x="625" y="264" width="133" height="32" rx="5" fill="#23476a"/><text x="691" y="286">F</text>

    <rect x="760" y="264" width="133" height="32" rx="5" fill="#1f6b63"/><text x="826" y="286">B</text>
    <rect x="895" y="228" width="133" height="32" rx="5" fill="#1f6b63"/><text x="961" y="250">B</text>
    <rect x="1030" y="192" width="133" height="32" rx="5" fill="#1f6b63"/><text x="1096" y="214">B</text>
    <rect x="1165" y="156" width="133" height="32" rx="5" fill="#1f6b63"/><text x="1231" y="178">B</text>
  </g>
  <text x="1325" y="232" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#64748b">Only 1 GPU busy</text>
  <text x="1325" y="256" font-family="Inter, sans-serif" font-size="17" fill="#64748b">at any moment</text>

  <!-- STRIP 2: GPIPE SCHEDULE -->
  <rect x="40" y="328" width="1520" height="332" rx="12" fill="#ffffff" stroke="#23476a" stroke-width="1.6"/>
  <text x="64" y="362" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">2. GPipe Micro-Batch Schedule (P = 4, M = 4 micro-batches F₀..F₃)</text>
  <rect x="1058" y="342" width="478" height="32" rx="6" fill="#e5f2ee"/>
  <text x="1297" y="364" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#16524b">Bubble = (P−1)/(M+P−1) = 3/7 = 42.9%</text>

  <g font-family="Inter, sans-serif" font-size="16" font-weight="600">
    <text x="64" y="408" fill="#334155">GPU 0 (Stage 0)</text>
    <text x="64" y="452" fill="#334155">GPU 1 (Stage 1)</text>
    <text x="64" y="496" fill="#334155">GPU 2 (Stage 2)</text>
    <text x="64" y="540" fill="#334155">GPU 3 (Stage 3)</text>
  </g>

  <!-- 14 time slots x=220..1452 -> 88px per slot (w=84) + AllReduce bar at x=1460..1536 -->
  <rect x="220" y="384" width="1230" height="36" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="428" width="1230" height="36" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="472" width="1230" height="36" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>
  <rect x="220" y="516" width="1230" height="36" rx="4" fill="url(#bubbleHatch)" stroke="#dfd7c9"/>

  <!-- Forward Wave F0..F3 -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">
    <!-- Row 0: t=0..3 -->
    <rect x="220" y="384" width="84" height="36" rx="5" fill="#23476a"/><text x="262" y="408">F₀</text>
    <rect x="308" y="384" width="84" height="36" rx="5" fill="#2e5984"/><text x="350" y="408">F₁</text>
    <rect x="396" y="384" width="84" height="36" rx="5" fill="#396b9e"/><text x="438" y="408">F₂</text>
    <rect x="484" y="384" width="84" height="36" rx="5" fill="#467eb8"/><text x="526" y="408">F₃</text>
    <!-- Row 1: t=1..4 -->
    <rect x="308" y="428" width="84" height="36" rx="5" fill="#23476a"/><text x="350" y="452">F₀</text>
    <rect x="396" y="428" width="84" height="36" rx="5" fill="#2e5984"/><text x="438" y="452">F₁</text>
    <rect x="484" y="428" width="84" height="36" rx="5" fill="#396b9e"/><text x="526" y="452">F₂</text>
    <rect x="572" y="428" width="84" height="36" rx="5" fill="#467eb8"/><text x="614" y="452">F₃</text>
    <!-- Row 2: t=2..5 -->
    <rect x="396" y="472" width="84" height="36" rx="5" fill="#23476a"/><text x="438" y="496">F₀</text>
    <rect x="484" y="472" width="84" height="36" rx="5" fill="#2e5984"/><text x="526" y="496">F₁</text>
    <rect x="572" y="472" width="84" height="36" rx="5" fill="#396b9e"/><text x="614" y="496">F₂</text>
    <rect x="660" y="472" width="84" height="36" rx="5" fill="#467eb8"/><text x="702" y="496">F₃</text>
    <!-- Row 3: t=3..6 -->
    <rect x="484" y="516" width="84" height="36" rx="5" fill="#23476a"/><text x="526" y="540">F₀</text>
    <rect x="572" y="516" width="84" height="36" rx="5" fill="#2e5984"/><text x="614" y="540">F₁</text>
    <rect x="660" y="516" width="84" height="36" rx="5" fill="#396b9e"/><text x="702" y="540">F₂</text>
    <rect x="748" y="516" width="84" height="36" rx="5" fill="#467eb8"/><text x="790" y="540">F₃</text>

    <!-- Backward Wave B3..B0 -->
    <!-- Row 3: t=7..10 -->
    <rect x="836" y="516" width="84" height="36" rx="5" fill="#16524b"/><text x="878" y="540">B₃</text>
    <rect x="924" y="516" width="84" height="36" rx="5" fill="#1f6b63"/><text x="966" y="540">B₂</text>
    <rect x="1012" y="516" width="84" height="36" rx="5" fill="#288278"/><text x="1054" y="540">B₁</text>
    <rect x="1100" y="516" width="84" height="36" rx="5" fill="#33998e"/><text x="1142" y="540">B₀</text>
    <!-- Row 2: t=8..11 -->
    <rect x="924" y="472" width="84" height="36" rx="5" fill="#16524b"/><text x="966" y="496">B₃</text>
    <rect x="1012" y="472" width="84" height="36" rx="5" fill="#1f6b63"/><text x="1054" y="496">B₂</text>
    <rect x="1100" y="472" width="84" height="36" rx="5" fill="#288278"/><text x="1142" y="496">B₁</text>
    <rect x="1188" y="472" width="84" height="36" rx="5" fill="#33998e"/><text x="1230" y="496">B₀</text>
    <!-- Row 1: t=9..12 -->
    <rect x="1012" y="428" width="84" height="36" rx="5" fill="#16524b"/><text x="1054" y="452">B₃</text>
    <rect x="1100" y="428" width="84" height="36" rx="5" fill="#1f6b63"/><text x="1142" y="452">B₂</text>
    <rect x="1188" y="428" width="84" height="36" rx="5" fill="#288278"/><text x="1230" y="452">B₁</text>
    <rect x="1276" y="428" width="84" height="36" rx="5" fill="#33998e"/><text x="1318" y="452">B₀</text>
    <!-- Row 0: t=10..13 -->
    <rect x="1100" y="384" width="84" height="36" rx="5" fill="#16524b"/><text x="1142" y="408">B₃</text>
    <rect x="1188" y="384" width="84" height="36" rx="5" fill="#1f6b63"/><text x="1230" y="408">B₂</text>
    <rect x="1276" y="384" width="84" height="36" rx="5" fill="#288278"/><text x="1318" y="408">B₁</text>
    <rect x="1364" y="384" width="84" height="36" rx="5" fill="#33998e"/><text x="1406" y="408">B₀</text>
  </g>

  <!-- Sync Optimizer Step bar -->
  <rect x="1464" y="384" width="72" height="168" rx="8" fill="#a8552a"/>
  <text x="1500" y="468" text-anchor="middle" transform="rotate(-90 1500 468)" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Sync &amp; Step</text>

  <!-- P2P arrows hint -->
  <line x1="296" y1="420" x2="316" y2="428" stroke="#1f6b63" stroke-width="2" marker-end="url(#arrP2P)"/>
  <line x1="384" y1="464" x2="404" y2="472" stroke="#1f6b63" stroke-width="2" marker-end="url(#arrP2P)"/>
  <line x1="472" y1="508" x2="492" y2="516" stroke="#1f6b63" stroke-width="2" marker-end="url(#arrP2P)"/>

  <!-- Footer notes inside GPipe strip -->
  <rect x="64" y="576" width="1472" height="64" rx="8" fill="#f7f4ec" stroke="#ded7c8"/>
  <text x="86" y="604" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#1b2230">Activation Memory Trade-off:</text>
  <text x="378" y="604" font-family="Inter, sans-serif" font-size="16" fill="#334155">GPipe keeps only micro-batch boundary activations in memory and recomputes stage internals during B₃..B₀.</text>
  <text x="86" y="628" font-family="Inter, sans-serif" font-size="16" fill="#5b6472">Increasing M (e.g., M ≥ 4P) drives bubble under 18%; switching to 1F1B cuts buffered activations from O(M) micro-batches down to O(P) stages.</text>
</svg>
