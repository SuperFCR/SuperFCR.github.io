<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#23476a"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1f6b63"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a8552a"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="840" rx="16" fill="#fcfaf6" stroke="#ddd6ca" stroke-width="2"/>

  <!-- Main Header -->
  <text x="48" y="54" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#1b2230">Four Collective Operations &amp; Sharded Axis Transitions</text>
  <text x="48" y="84" font-family="Inter, -apple-system, sans-serif" font-size="18" fill="#5b6472">Left: same [1, 2] / [3, 4] vector under all 4 ops  ·  Right: 4-GPU Y-group inside an (X=8, Y=4) mesh</text>

  <!-- LEFT PANEL -->
  <rect x="40" y="108" width="750" height="694" rx="14" fill="#f7f4ec" stroke="#ded7c8" stroke-width="1.5"/>
  <text x="68" y="146" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#1b2230">1. Same Input Run Four Ways (2 GPUs)</text>

  <!-- Initial inputs -->
  <text x="68" y="196" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#475569">Initial Shards</text>
  <rect x="242" y="168" width="184" height="44" rx="8" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.5"/>
  <text x="334" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#23476a">GPU 0: [1, 2]</text>
  <rect x="454" y="168" width="184" height="44" rx="8" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.5"/>
  <text x="546" y="196" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1f6b63">GPU 1: [3, 4]</text>

  <!-- Row 1: AllGather -->
  <rect x="64" y="232" width="612" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="64" y="232" width="166" height="114" rx="10" fill="#e9eff7"/>
  <rect x="218" y="232" width="12" height="114" fill="#e9eff7"/>
  <text x="147" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#1e3a5f">AllGather</text>
  <text x="147" y="302" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Concat full shards</text>
  <text x="147" y="326" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="600" fill="#23476a">[E_Y] → [E]</text>

  <text x="248" y="278" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 0:</text>
  <rect x="322" y="252" width="128" height="36" rx="6" fill="#eef4fb" stroke="#23476a" stroke-width="1.5"/>
  <text x="386" y="276" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[1, 2, 3, 4]</text>
  <text x="248" y="324" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 1:</text>
  <rect x="322" y="298" width="128" height="36" rx="6" fill="#eef4fb" stroke="#23476a" stroke-width="1.5"/>
  <text x="386" y="322" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[1, 2, 3, 4]</text>
  <text x="468" y="284" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">Every rank gets</text>
  <text x="468" y="310" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">the full tensor</text>

  <!-- Row 2: ReduceScatter -->
  <rect x="64" y="366" width="612" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="64" y="366" width="166" height="114" rx="10" fill="#e5f2ee"/>
  <rect x="218" y="366" width="12" height="114" fill="#e5f2ee"/>
  <text x="147" y="408" text-anchor="middle" font-family="Inter, sans-serif" font-size="18.5" font-weight="700" fill="#16524b">ReduceScatter</text>
  <text x="147" y="434" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Sum + keep shard</text>
  <text x="147" y="458" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="600" fill="#1f6b63">{U_Y} → [F_Y]</text>

  <text x="248" y="412" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 0:</text>
  <rect x="322" y="386" width="152" height="36" rx="6" fill="#e9f5f1" stroke="#1f6b63" stroke-width="1.5"/>
  <text x="398" y="410" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[1+3] = [4]</text>
  <text x="248" y="458" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 1:</text>
  <rect x="322" y="432" width="152" height="36" rx="6" fill="#e9f5f1" stroke="#1f6b63" stroke-width="1.5"/>
  <text x="398" y="456" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[2+4] = [6]</text>
  <text x="490" y="418" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">Elementwise sum,</text>
  <text x="490" y="444" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">1/N shard per rank</text>

  <!-- Row 3: AllReduce -->
  <rect x="64" y="500" width="612" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="64" y="500" width="166" height="114" rx="10" fill="#f3ebf7"/>
  <rect x="218" y="500" width="12" height="114" fill="#f3ebf7"/>
  <text x="147" y="542" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#5b346a">AllReduce</text>
  <text x="147" y="568" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Sum everywhere</text>
  <text x="147" y="592" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="600" fill="#6b4578">{U_Y} → [F]</text>

  <text x="248" y="546" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 0:</text>
  <rect x="322" y="520" width="128" height="36" rx="6" fill="#f6eff9" stroke="#6b4578" stroke-width="1.5"/>
  <text x="386" y="544" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[4, 6]</text>
  <text x="248" y="592" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 1:</text>
  <rect x="322" y="566" width="128" height="36" rx="6" fill="#f6eff9" stroke="#6b4578" stroke-width="1.5"/>
  <text x="386" y="590" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[4, 6]</text>
  <text x="468" y="552" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">= ReduceScatter</text>
  <text x="468" y="578" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">+ AllGather (2 steps)</text>

  <!-- Right bracket showing RS + AG = AR -->
  <path d="M 684 422 L 716 422 L 716 557 L 692 557" fill="none" stroke="#6b4578" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <rect x="688" y="458" width="90" height="58" rx="8" fill="#fcfaf6" stroke="#6b4578" stroke-width="1.5"/>
  <text x="733" y="483" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#5b346a">RS</text>
  <text x="733" y="505" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#5b346a">+ AG</text>

  <!-- Row 4: All-to-All -->
  <rect x="64" y="634" width="612" height="114" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="64" y="634" width="166" height="114" rx="10" fill="#faece3"/>
  <rect x="218" y="634" width="12" height="114" fill="#faece3"/>
  <text x="147" y="676" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="700" fill="#9a461e">All-to-All</text>
  <text x="147" y="702" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Swap split axis</text>
  <text x="147" y="726" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="600" fill="#a8552a">[E_Y, F] → [E, F_Y]</text>

  <text x="248" y="680" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 0:</text>
  <rect x="322" y="654" width="128" height="36" rx="6" fill="#fcf2eb" stroke="#a8552a" stroke-width="1.5"/>
  <text x="386" y="678" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[1, 3]</text>
  <text x="248" y="726" font-family="Inter, sans-serif" font-size="18" font-weight="600" fill="#1b2230">GPU 1:</text>
  <rect x="322" y="700" width="128" height="36" rx="6" fill="#fcf2eb" stroke="#a8552a" stroke-width="1.5"/>
  <text x="386" y="724" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="700" fill="#1b2230">[2, 4]</text>
  <text x="468" y="686" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">GPU j receives</text>
  <text x="468" y="712" font-family="Inter, sans-serif" font-size="17" fill="#5b6472">chunk j from all</text>

  <text x="68" y="782" font-family="Inter, sans-serif" font-size="17" fill="#475569">Note: Scatter splits without summing; ReduceScatter performs + before splitting.</text>

  <!-- RIGHT PANEL -->
  <rect x="816" y="108" width="744" height="694" rx="14" fill="#f7f4ec" stroke="#ded7c8" stroke-width="1.5"/>
  <text x="844" y="146" font-family="Inter, sans-serif" font-size="21" font-weight="700" fill="#1b2230">2. Worked Mesh: A[E_Y, F] on Mesh(X=8, Y=4)</text>

  <!-- Initial Matrix State Box -->
  <rect x="844" y="168" width="688" height="168" rx="12" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.5"/>
  <text x="866" y="200" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#1b2230">Initial Y-Group (E = 2048 along Y=0..3 · F = 8192 replicated)</text>
  <text x="866" y="226" font-family="Inter, sans-serif" font-size="16" fill="#5b6472">512 × 8192 × 2 B (BF16) = 8 MiB / GPU   (8 identical Y-groups across X = 0..7)</text>

  <!-- 4 shards row for initial Y=0..3 -->
  <g transform="translate(868,244)">
    <rect x="0" y="0" width="150" height="72" rx="8" fill="#e8eff7" stroke="#23476a" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#1e3a5f">Y = 0</text>
    <text x="75" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#334155">Rows 0–511</text>

    <rect x="164" y="0" width="150" height="72" rx="8" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.5"/>
    <text x="239" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#16524b">Y = 1</text>
    <text x="239" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#334155">Rows 512–1023</text>

    <rect x="328" y="0" width="150" height="72" rx="8" fill="#faece3" stroke="#a8552a" stroke-width="1.5"/>
    <text x="403" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#9a461e">Y = 2</text>
    <text x="403" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#334155">Rows 1024–1535</text>

    <rect x="492" y="0" width="150" height="72" rx="8" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.5"/>
    <text x="567" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="700" fill="#5b346a">Y = 3</text>
    <text x="567" y="54" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#334155">Rows 1536–2047</text>
  </g>

  <!-- Branch arrows -->
  <line x1="1035" y1="338" x2="1010" y2="394" stroke="#23476a" stroke-width="2.6" marker-end="url(#arrowNavy)"/>
  <rect x="860" y="346" width="136" height="32" rx="6" fill="#23476a"/>
  <text x="928" y="368" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#ffffff">AllGather_Y</text>

  <line x1="1340" y1="338" x2="1365" y2="394" stroke="#a8552a" stroke-width="2.6" marker-end="url(#arrowAmber)"/>
  <rect x="1378" y="346" width="144" height="32" rx="6" fill="#a8552a"/>
  <text x="1450" y="368" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#ffffff">AllToAll_Y</text>

  <!-- Branch 1: AllGather_Y result -->
  <rect x="844" y="402" width="332" height="380" rx="12" fill="#ffffff" stroke="#23476a" stroke-width="1.8"/>
  <text x="1010" y="436" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="19" font-weight="700" fill="#1e3a5f">[E_Y, F] → [E, F]</text>
  <text x="1010" y="464" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" fill="#475569">Full 2048 × 8192 on every rank</text>

  <!-- Draw 2 representative GPU output boxes (Y=0 and Y=1..3) cleanly -->
  <g transform="translate(866,484)">
    <text x="64" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y = 0</text>
    <rect x="0" y="30" width="128" height="44" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="0" y="74" width="128" height="44" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="0" y="118" width="128" height="44" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="0" y="162" width="128" height="44" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>
    <text x="64" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1b2230">0–511</text>
    <text x="64" y="102" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1b2230">512–1023</text>
    <text x="64" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1b2230">1024–1535</text>
    <text x="64" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#1b2230">1536–2047</text>

    <text x="224" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y = 1, 2, 3</text>
    <rect x="160" y="30" width="128" height="44" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="160" y="74" width="128" height="44" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="160" y="118" width="128" height="44" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="160" y="162" width="128" height="44" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>
    <text x="224" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#1b2230">Identical</text>
    <text x="224" y="144" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">2048 × 8192</text>
  </g>
  <rect x="866" y="710" width="288" height="52" rx="8" fill="#eef4fb"/>
  <text x="1010" y="734" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">32 MiB / GPU (4× expand)</text>
  <text x="1010" y="754" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Needs full activation / weight</text>

  <!-- Branch 2: AllToAll_Y result -->
  <rect x="1200" y="402" width="332" height="380" rx="12" fill="#ffffff" stroke="#a8552a" stroke-width="1.8"/>
  <text x="1366" y="436" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="19" font-weight="700" fill="#9a461e">[E_Y, F] → [E, F_Y]</text>
  <text x="1366" y="464" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" fill="#475569">Row-split becomes Col-split</text>

  <!-- 4 vertical column strips representing Y=0,1,2,3 each owning all 2048 rows x 2048 cols -->
  <g transform="translate(1224,484)">
    <text x="32" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y=0</text>
    <rect x="4" y="30" width="56" height="38" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="4" y="68" width="56" height="38" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="4" y="106" width="56" height="38" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="4" y="144" width="56" height="38" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>

    <text x="104" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y=1</text>
    <rect x="76" y="30" width="56" height="38" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="76" y="68" width="56" height="38" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="76" y="106" width="56" height="38" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="76" y="144" width="56" height="38" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>

    <text x="176" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y=2</text>
    <rect x="148" y="30" width="56" height="38" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="148" y="68" width="56" height="38" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="148" y="106" width="56" height="38" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="148" y="144" width="56" height="38" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>

    <text x="248" y="20" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" fill="#1b2230">Y=3</text>
    <rect x="220" y="30" width="56" height="38" fill="#e8eff7" stroke="#23476a" stroke-width="1.2"/>
    <rect x="220" y="68" width="56" height="38" fill="#e5f2ee" stroke="#1f6b63" stroke-width="1.2"/>
    <rect x="220" y="106" width="56" height="38" fill="#faece3" stroke="#a8552a" stroke-width="1.2"/>
    <rect x="220" y="144" width="56" height="38" fill="#f3ebf7" stroke="#6b4578" stroke-width="1.2"/>

    <text x="140" y="208" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Each strip = 2048 rows × 2048 cols</text>
  </g>
  <rect x="1222" y="710" width="288" height="52" rx="8" fill="#faece3"/>
  <text x="1366" y="734" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#9a461e">8 MiB / GPU (1× unchanged)</text>
  <text x="1366" y="754" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#475569">Concat along rows, split cols</text>
</svg>
