<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" width="1600" height="780" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>PocketRig architecture</title>
  <desc>Phone and Mac reach a personal Paseo instance on an always-on workstation over a Tailscale tailnet; agents submit heavy jobs to GPU nodes over SSH and pull back small results.</desc>
  <defs>
    <marker id="a-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#205488"/></marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="780" fill="#ffffff"/>

  <!-- tailnet -->
  <rect x="20" y="20" width="1010" height="740" rx="30" fill="#f2fbf9" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="52" y="70" font-size="24" font-weight="700" fill="#0f766e">Tailscale tailnet<tspan dx="12" font-weight="400" fill="#4b5563" font-size="20">·</tspan><tspan dx="10" font-weight="400" fill="#4b5563" font-size="20">your own devices only, no public ports</tspan></text>

  <!-- clients -->
  <rect x="56" y="150" width="290" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="82" y="182" width="30" height="50" rx="7" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="92" y1="224" x2="102" y2="224" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text x="132" y="206" font-size="28" font-weight="700" fill="#0f172a">Phone</text>
  <text x="132" y="238" font-size="19" fill="#64748b">Paseo app</text>
  <text x="132" y="266" font-size="19" fill="#64748b">start · check · steer</text>

  <rect x="56" y="470" width="290" height="170" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="78" y="506" width="44" height="30" rx="4" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="70" y1="543" x2="130" y2="543" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text x="142" y="526" font-size="28" font-weight="700" fill="#0f172a">Mac</text>
  <text x="142" y="558" font-size="19" fill="#64748b">Paseo app or web</text>
  <text x="142" y="586" font-size="19" fill="#64748b">continue on a laptop</text>

  <line x1="201" y1="332" x2="201" y2="458" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 6" marker-start="url(#a-grey)" marker-end="url(#a-grey)"/>
  <text x="216" y="402" font-size="19" fill="#64748b">same session</text>

  <path d="M346 235 H396 M346 555 H396 M396 235 V555" fill="none" stroke="#205488" stroke-width="3"/>

  <!-- workstation -->
  <rect x="440" y="110" width="560" height="620" rx="22" fill="#ffffff" stroke="#205488" stroke-width="2.5"/>
  <path d="M440 196 V132 a22 22 0 0 1 22 -22 H978 a22 22 0 0 1 22 22 V196 Z" fill="#205488"/>
  <text x="470" y="152" font-size="28" font-weight="700" fill="#ffffff">Always-on workstation</text>
  <text x="470" y="182" font-size="18" fill="#dbe7f5">Windows + WSL2 · Linux · macOS · online 24/7</text>

  <rect x="470" y="226" width="500" height="112" rx="14" fill="#eef4fb" stroke="#b9cde4" stroke-width="2"/>
  <text x="494" y="266" font-size="25" font-weight="700" fill="#0f2c4c">Your Paseo instance</text>
  <text x="494" y="296" font-size="19" fill="#475569">one per person · systemd paseo@user / launchd</text>
  <text x="494" y="322" font-size="19" fill="#475569">own port and password · relay off</text>

  <path d="M720 338 V368" fill="none" stroke="#205488" stroke-width="3" marker-end="url(#a-navy)"/>

  <rect x="470" y="372" width="500" height="112" rx="14" fill="#eef4fb" stroke="#b9cde4" stroke-width="2"/>
  <text x="494" y="412" font-size="25" font-weight="700" fill="#0f2c4c">Claude Code / Codex</text>
  <text x="494" y="442" font-size="19" fill="#475569">shared install, started by wrapper scripts</text>
  <text x="494" y="468" font-size="19" fill="#475569">runs as your UID · pre-launch checks</text>

  <rect x="470" y="530" width="240" height="160" rx="14" fill="#f8fafc" stroke="#d5dde8" stroke-width="2"/>
  <text x="494" y="574" font-size="24" font-weight="700" fill="#0f172a" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">~/projects</text>
  <text x="494" y="608" font-size="19" fill="#475569">code · git</text>
  <text x="494" y="636" font-size="19" fill="#475569">light checks</text>

  <rect x="730" y="530" width="240" height="160" rx="14" fill="#fff8ef" stroke="#f0c896" stroke-width="2"/>
  <text x="754" y="574" font-size="24" font-weight="700" fill="#0f172a" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">~/results</text>
  <text x="754" y="608" font-size="19" fill="#475569">metrics · plots</text>
  <text x="754" y="636" font-size="19" fill="#475569">summary.md</text>

  <!-- workstation <-> GPU -->
  <path d="M970 420 H1204" fill="none" stroke="#205488" stroke-width="3" marker-end="url(#a-navy)"/>
  <text x="1118" y="404" font-size="18" fill="#205488" text-anchor="middle" font-weight="600">SSH: submit job</text>
  <path d="M1208 520 H1118 V610 H976" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#a-amber)"/>
  <text x="1118" y="648" font-size="18" fill="#b45309" text-anchor="middle" font-weight="600">pull back a few MB</text>
  <text x="1118" y="672" font-size="17" fill="#b45309" text-anchor="middle">metrics · plots · logs</text>

  <!-- GPU nodes -->
  <rect x="1210" y="200" width="360" height="370" rx="22" fill="#ffffff" stroke="#b45309" stroke-width="2.5"/>
  <path d="M1210 286 V222 a22 22 0 0 1 22 -22 H1548 a22 22 0 0 1 22 22 V286 Z" fill="#b45309"/>
  <text x="1236" y="242" font-size="26" font-weight="700" fill="#ffffff">GPU / compute nodes</text>
  <text x="1236" y="270" font-size="18" fill="#fde7c8">reached over SSH</text>
  <text x="1236" y="334" font-size="20" fill="#3f3f46">datasets · model weights</text>
  <text x="1236" y="370" font-size="20" fill="#3f3f46">training · evaluation</text>
  <text x="1236" y="406" font-size="20" fill="#3f3f46">inference · checkpoints</text>
  <text x="1236" y="452" font-size="18" fill="#64748b" font-family="Consolas, 'SFMono-Regular', Menlo, monospace">Slurm · systemd-run · tmux</text>
  <text x="1236" y="534" font-size="18" fill="#64748b" font-style="italic">full artifacts stay here</text>
  <path d="M396 282 H464" fill="none" stroke="#205488" stroke-width="3" marker-end="url(#a-navy)"/>
</svg>
