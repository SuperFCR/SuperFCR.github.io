<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <rect width="1400" height="560" rx="16" fill="#ffffff"/>
  <text x="700" y="40" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#141923">Three Core Mechanisms in Marin Snowball Agentic Post-Training</text>
  <text x="700" y="68" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="17" fill="#5b6270">Recovering from self-induced errors (Relay SFT), preserving GRPO diversity (Plateau Dropping), and debugging RL infra</text>

  <!-- Panel 1: Relay SFT -->
  <rect x="24" y="92" width="434" height="442" rx="14" fill="#f8fafd" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="92" width="434" height="48" rx="14" fill="#1f4e79"/>
  <rect x="24" y="124" width="434" height="16" fill="#1f4e79"/>
  <text x="241" y="123" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff">1. Relay SFT (Teacher Recovery)</text>

  <rect x="42" y="158" width="398" height="84" rx="10" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="241" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#334155">Student Prefix S (loss_mask = 0)</text>
  <text x="241" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#475569">Snowball plays 52% turns · errors stay in context</text>
  <text x="241" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#64748b">Triggers: bad JSON · early done (18.4k) · limit (32.3k)</text>

  <rect x="42" y="256" width="398" height="84" rx="10" fill="#faece5" stroke="#b4532a" stroke-width="2"/>
  <text x="241" y="283" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#b4532a">Teacher Takeover R / T (loss_mask = 1)</text>
  <text x="241" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#141923">Qwen3.8-27B repairs action or completes solution</text>
  <text x="241" y="328" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#475569">Marker copy 22% → 0.1%; 808 pass + 808 fail pairs</text>

  <rect x="42" y="356" width="398" height="156" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="241" y="384" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#1f4e79">Measured Episode &amp; Caveat</text>
  <text x="241" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="15.5" fill="#141923">Episode pass: 64.4% (Qwen) → 74.4% (Relay)</text>
  <text x="241" y="442" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#334155">14.69M teacher recovery tokens in student traces</text>
  <text x="241" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#334155">Fixed FP32/CF=2.0 runs tie vanilla SFT (~47%)</text>
  <text x="241" y="496" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#64748b">Student runs fully autonomously at test time</text>

  <!-- Panel 2: Plateau Dropping -->
  <rect x="483" y="92" width="434" height="442" rx="14" fill="#f3faf7" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="483" y="92" width="434" height="48" rx="14" fill="#1b6b5a"/>
  <rect x="483" y="124" width="434" height="16" fill="#1b6b5a"/>
  <text x="700" y="123" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff">2. Plateau Dropping (Token Filter)</text>

  <rect x="501" y="158" width="398" height="90" rx="10" fill="#ffffff" stroke="#1b6b5a" stroke-width="2"/>
  <text x="700" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#1b6b5a">Relative Change δ_i(j) &lt; 0.1 Twice</text>
  <text x="700" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#141923">δ_i(j) = |ℓ^(j) − ℓ^(j−1)| / max(ℓ^(j−1), 0.05)</text>
  <text x="700" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#475569">Re-included automatically if future loss shifts</text>

  <rect x="501" y="264" width="398" height="96" rx="10" fill="#e2f3ee" stroke="#8dcab9"/>
  <text x="700" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#141923">Token Fate @ Epoch 10 (62% Dropped)</text>
  <rect x="521" y="306" width="196" height="26" rx="4" fill="#1b6b5a"/>
  <text x="619" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">56% learned</text>
  <rect x="719" y="306" width="34" height="26" rx="4" fill="#d97706"/>
  <text x="736" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">5%</text>
  <rect x="755" y="306" width="124" height="26" rx="4" fill="#1f4e79"/>
  <text x="817" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">38% active</text>
  <text x="700" y="351" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" fill="#334155">11 B/tok host table (+1.3% step) · grad clip 4.0</text>

  <rect x="501" y="376" width="398" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="700" y="404" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#1b6b5a">Diversity &amp; Learnable Band Gain</text>
  <text x="700" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#141923">3ep SWE: 31.9 / 67.0 vs TailSFT 23.4 / 51.0</text>
  <text x="700" y="459" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#141923">10ep SWE: 77.5% pass@8 (+4.5 pp vs SFT)</text>
  <text x="700" y="486" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1b6b5a">57 vs 48 learnable tasks · 1.19 vs 0.72 nats</text>

  <!-- Panel 3: RL Stack -->
  <rect x="942" y="92" width="434" height="442" rx="14" fill="#fdf8f5" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="942" y="92" width="434" height="48" rx="14" fill="#b4532a"/>
  <rect x="942" y="124" width="434" height="16" fill="#b4532a"/>
  <text x="1159" y="123" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#ffffff">3. RL Stack: TITO, Entropy &amp; EAGLE-3</text>

  <rect x="960" y="158" width="398" height="90" rx="10" fill="#ffffff" stroke="#b4532a" stroke-width="2"/>
  <text x="1159" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#b4532a">Token-In-Token-Out (Harbor #122)</text>
  <text x="1159" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#141923">["hel","lo"] → text → ["hello"] breaks IS!</text>
  <text x="1159" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#475569">Keep exact token IDs + full-dist T=1.0 sampling</text>

  <rect x="960" y="264" width="398" height="96" rx="10" fill="#faece5" stroke="#e5b39c"/>
  <text x="1159" y="292" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#141923">Frozen EAGLE-3 SpecDec (1.42×)</text>
  <text x="1159" y="319" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#334155">Trained on Pre-RL Probe rollouts (2× decode)</text>
  <text x="1159" y="343" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#475569">86% weights identical @ step 36 → stable accept</text>

  <rect x="960" y="376" width="398" height="136" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1159" y="404" text-anchor="middle" font-family="Inter, sans-serif" font-size="16.5" font-weight="700" fill="#b4532a">SFT+RL (1,833 Tasks · 60 GRPO Steps)</text>
  <text x="1159" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#141923">SWE-bench r100: 12.8% → 46.5% → 50.5%</text>
  <text x="1159" y="459" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#141923">Terminal-Bench 2.1: 7.2% → 18.8% → 23.9%</text>
  <text x="1159" y="486" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1f4e79">Invalid TBLite actions 80%→2% · ctx fail 91→56%</text>
</svg>