<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1580 520" width="1580" height="520" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Marin End-to-End Open Development Pipeline</title>
  <defs>
    <marker id="ar-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#205488"/>
    </marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#146c50"/>
    </marker>
  </defs>

  <rect width="1580" height="520" fill="#ffffff"/>

  <!-- Left Container: Mochi Pre-Training & Mid-Training -->
  <rect x="24" y="24" width="918" height="332" rx="22" fill="#f8fafd" stroke="#205488" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="52" y="64" font-size="22" font-weight="700" fill="#205488">Mochi 535B-A23B<tspan dx="12" font-weight="400" fill="#475569" font-size="18.5">· Pre-Training &amp; 262K Mid-Training (704 GB200s · Commit 12d8b6f0)</tspan></text>

  <!-- Stage 1: Datakit -->
  <rect x="48" y="88" width="268" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M48 140 V104 a16 16 0 0 1 16 -16 H300 a16 16 0 0 1 16 16 V140 Z" fill="#dbeafe"/>
  <text x="68" y="122" font-size="20.5" font-weight="700" fill="#0f2c4c">1. Datakit 25T</text>
  <text x="68" y="176" font-size="17" fill="#1e293b">152 sources · 18.71B docs</text>
  <text x="68" y="210" font-size="17" fill="#475569">5-gram LSH (−2.13T)</text>
  <text x="68" y="244" font-size="17" fill="#475569">13-gram Bloom (−13.66B)</text>
  <text x="68" y="282" font-size="17" font-weight="600" fill="#205488">40×5 Harrier · 872 proxies</text>

  <line x1="316" y1="208" x2="346" y2="208" stroke="#205488" stroke-width="3" marker-end="url(#ar-navy)"/>

  <!-- Stage 2: 535B Pre-Train -->
  <rect x="352" y="88" width="278" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M352 140 V104 a16 16 0 0 1 16 -16 H614 a16 16 0 0 1 16 16 V140 Z" fill="#faece5"/>
  <text x="372" y="122" font-size="20.5" font-weight="700" fill="#9a3412">2. 535B Pre-Train</text>
  <text x="372" y="176" font-size="17" fill="#1e293b">48L×d6144 · 8/384 + 2S</text>
  <text x="372" y="210" font-size="17" fill="#475569">LatentMoE + Hist QB (2.5)</text>
  <text x="372" y="244" font-size="17" fill="#475569">DP11×EP64 · Ragged A2A</text>
  <text x="372" y="282" font-size="17" font-weight="600" fill="#b4532a">MuonH / AdamH · 18T tok</text>

  <line x1="630" y1="208" x2="660" y2="208" stroke="#205488" stroke-width="3" marker-end="url(#ar-navy)"/>

  <!-- Stage 3: Mid-Train -->
  <rect x="666" y="88" width="252" height="240" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M666 140 V104 a16 16 0 0 1 16 -16 H902 a16 16 0 0 1 16 16 V140 Z" fill="#eef2ff"/>
  <text x="686" y="122" font-size="20.5" font-weight="700" fill="#3730a3">3. 262K Mid-Train</text>
  <text x="686" y="176" font-size="17" fill="#1e293b">80% Phase-2 Cooldown</text>
  <text x="686" y="210" font-size="17" fill="#475569">4K → 16K → 65K → 262K</text>
  <text x="686" y="244" font-size="17" fill="#475569">QK 1.3 → 1.66 + log² scale</text>
  <text x="686" y="282" font-size="17" font-weight="600" fill="#4338ca">Weight avg · 57 ckpts</text>

  <!-- Transfer arrow between Mochi & Snowball DAG -->
  <line x1="942" y1="208" x2="982" y2="208" stroke="#146c50" stroke-width="3.5" marker-end="url(#ar-teal)"/>

  <!-- Right Container: Snowball Agentic Post-Training -->
  <rect x="988" y="24" width="568" height="332" rx="22" fill="#f2fbf9" stroke="#146c50" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text x="1014" y="64" font-size="22" font-weight="700" fill="#146c50">Snowball 67B-A2B<tspan dx="10" font-weight="400" fill="#475569" font-size="18.5">· Post-Training DAG (10T TPU Base)</tspan></text>

  <!-- Stage 4: Agentic SFT -->
  <rect x="1012" y="88" width="244" height="240" rx="16" fill="#ffffff" stroke="#99d5c9" stroke-width="2"/>
  <path d="M1012 140 V104 a16 16 0 0 1 16 -16 H1240 a16 16 0 0 1 16 16 V140 Z" fill="#146c50"/>
  <text x="1032" y="122" font-size="20.5" font-weight="700" fill="#ffffff">4. Agentic SFT</text>
  <text x="1032" y="176" font-size="17" fill="#1e293b">CalibForge + Kimi SFT</text>
  <text x="1032" y="210" font-size="17" fill="#475569">Relay SFT (S / R / T)</text>
  <text x="1032" y="244" font-size="17" fill="#475569">Plateau Dropping (clip=4)</text>
  <text x="1032" y="282" font-size="17" font-weight="600" fill="#146c50">77.5% @8 · 1.19 nats</text>

  <line x1="1256" y1="208" x2="1282" y2="208" stroke="#146c50" stroke-width="3" marker-end="url(#ar-teal)"/>

  <!-- Stage 5: Agentic RL -->
  <rect x="1288" y="88" width="244" height="240" rx="16" fill="#ffffff" stroke="#b9cde4" stroke-width="2"/>
  <path d="M1288 140 V104 a16 16 0 0 1 16 -16 H1516 a16 16 0 0 1 16 16 V140 Z" fill="#205488"/>
  <text x="1308" y="122" font-size="20.5" font-weight="700" fill="#ffffff">5. Agentic RL</text>
  <text x="1308" y="176" font-size="17" fill="#1e293b">Pre-RL Probe (1,833 band)</text>
  <text x="1308" y="210" font-size="17" fill="#475569">TITO (#122) + Full-Dist</text>
  <text x="1308" y="244" font-size="17" fill="#475569">Frozen EAGLE-3 (1.42×)</text>
  <text x="1308" y="282" font-size="17" font-weight="600" fill="#205488">50.5% SWE · 23.9% TB2.1</text>

  <!-- Vertical Connectors to Stage 6 -->
  <line x1="491" y1="356" x2="491" y2="394" stroke="#205488" stroke-width="2.5" marker-end="url(#ar-navy)"/>
  <line x1="792" y1="356" x2="792" y2="394" stroke="#205488" stroke-width="2.5" marker-end="url(#ar-navy)"/>
  <line x1="1410" y1="356" x2="1410" y2="394" stroke="#146c50" stroke-width="2.5" marker-end="url(#ar-teal)"/>

  <!-- Stage 6: Open Evaluation & Telemetry -->
  <rect x="24" y="400" width="1532" height="96" rx="18" fill="#ffffff" stroke="#205488" stroke-width="2.5"/>
  <rect x="24" y="400" width="220" height="96" rx="18" fill="#205488"/>
  <rect x="220" y="400" width="24" height="96" fill="#205488"/>
  <text x="134" y="442" text-anchor="middle" font-size="20.5" font-weight="700" fill="#ffffff">6. Open Eval</text>
  <text x="134" y="472" text-anchor="middle" font-size="16.5" fill="#dbeafe">mtracker · #10197</text>

  <text x="274" y="440" font-size="19.5" font-weight="700" fill="#0f172a">Dropless Paloma (1.982 @ 4K vs 2.039 forecast) · Sustained MFU (21.5% → 30%) · 18 + 8 Benchmark Policy</text>
  <text x="274" y="474" font-size="18" fill="#475569">5-Rung Scaling Ladder (1.6B–535B) · Tournament DARE-TIES Selection · Nemenyi Critical Difference &amp; Trace Audits</text>
</svg>
